services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autolabeling
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autolabeling"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-jev-autoyolo-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_SAM3: ${INSTALL_SAM3:-false}
    ports:
      - "8000:8000"
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/autolabeling
      PYTHONPATH: /app
      HF_HOME: /home/appuser/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      DEVICE: ${DEVICE:-}
      ANNOTATION_ONLY: ${ANNOTATION_ONLY:-false}
      JEV_PROVIDER: ${JEV_PROVIDER:-typesafe}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-}
      JEV_MULTI_INSTANCE: ${JEV_MULTI_INSTANCE:-auto}
      JEV_FALLBACK_TO_LOCAL: ${JEV_FALLBACK_TO_LOCAL:-true}
    volumes:
      - model-cache:/app/model
      - modelscope-models:/app/modelscope_models
      - sam3-cache:/home/appuser/.cache/huggingface
      - uploads:/app/uploads
      - training-data:/app/training_runs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    image: ${FRONTEND_IMAGE:-jev-autoyolo-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  model-cache:
  modelscope-models:
  sam3-cache:
  uploads:
  training-data:
